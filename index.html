<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <meta name="theme-color" content="#3f8cff">
  <title>Лопни шарик — am, is, are</title>
  <style>
    :root{--ink:#17336b;--cream:#fff8de;--blue:#3f8cff;--pink:#ff5e91;--green:#23c483;--yellow:#ffd84d}
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html,body{width:100%;height:100%;margin:0;overflow:hidden;font-family:"Trebuchet MS",Arial,sans-serif;background:#82d8ff;color:var(--ink);user-select:none}
    button{font:inherit}
    .game{position:relative;width:100%;height:100%;overflow:hidden;background:linear-gradient(#54bcff 0%,#aee7ff 57%,#fff1bf 100%)}
    .sun{position:absolute;right:4%;top:6%;z-index:1;width:clamp(120px,14vw,175px);height:auto;filter:drop-shadow(0 0 24px #fff59b);transform-origin:center;animation:sunSway 4s ease-in-out infinite alternate}
    @keyframes sunSway{from{transform:rotate(-12deg)}to{transform:rotate(12deg)}}
    .cloud{position:absolute;z-index:2;width:clamp(210px,25vw,330px);height:auto;opacity:.92;filter:drop-shadow(0 10px 9px #3082b238);animation:drift 38s linear infinite}
    .c1{top:17%;left:-360px}
    .c2{top:38%;left:-390px;width:clamp(170px,20vw,270px);animation-delay:-21s}
    .c3{top:57%;left:-420px;width:clamp(190px,22vw,290px);opacity:.8;animation-delay:-9s;animation-duration:46s}
    .c4{top:72%;left:-440px;width:clamp(150px,18vw,240px);opacity:.75;animation-delay:-31s;animation-duration:52s}
    .c5{top:6%;left:-400px;width:clamp(160px,19vw,255px);opacity:.82;animation-delay:-15s;animation-duration:43s}
    @keyframes drift{to{left:calc(100% + 390px)}}
    .hill{position:absolute;left:-8%;bottom:-18%;width:75%;height:36%;background:#5dc95a;border-radius:50% 50% 0 0;box-shadow:inset 0 14px #72dc69}
    .hill.two{left:45%;bottom:-20%;width:70%;height:39%;background:#40b950;box-shadow:inset 0 14px #57ca5f}
    .brand{position:absolute;top:12px;left:14px;z-index:8;padding:8px 20px 10px;border:3px solid #fff;border-radius:20px;background:linear-gradient(135deg,#ffffffed,#e8f7ffeb);box-shadow:0 6px 0 #2b83c5,0 11px 22px #24528a35;color:#24528a;font-family:Georgia,"Times New Roman",serif;font-size:clamp(.68rem,1.5vw,.92rem);font-style:italic;font-weight:700;letter-spacing:.015em;text-shadow:0 2px 0 #fff;white-space:nowrap}
    .hud{position:absolute;left:14px;right:14px;top:62px;z-index:9;display:flex;justify-content:space-between;align-items:center;pointer-events:none}
    .pill{min-height:42px;padding:8px 13px;border:3px solid #fff;border-radius:18px;background:#17336bd9;color:#fff;box-shadow:0 5px 0 #0c214d;font-size:clamp(.88rem,2.6vw,1.1rem);font-weight:900}
    .hearts{position:fixed;right:16px;bottom:150px;z-index:18;display:flex;gap:4px;min-height:0;padding:6px 9px;border:2px solid #fff;border-radius:18px;background:linear-gradient(145deg,#fff5,#17336bd9);box-shadow:0 4px 0 #0c214d,0 8px 18px #183a6855;pointer-events:none}
    .life-heart{display:inline-block;font-size:clamp(1.4rem,3.2vw,2.1rem);line-height:1;filter:drop-shadow(0 3px 1px #8d113f) drop-shadow(0 5px 5px #10264e65);transform-origin:center;animation:heartPulse 1.35s ease-in-out infinite}
    .life-heart:nth-child(2){animation-delay:.12s}.life-heart:nth-child(3){animation-delay:.24s}.life-heart:nth-child(4){animation-delay:.36s}.life-heart:nth-child(5){animation-delay:.48s}
    .life-heart.empty{filter:grayscale(1) opacity(.32);animation:none;transform:scale(.82)}
    @keyframes heartPulse{0%,100%{transform:scale(1)}45%{transform:scale(1.14)}60%{transform:scale(1.04)}}
    .sound{pointer-events:auto;cursor:pointer;min-width:46px;border:0;background:#fff;color:var(--ink)}
    .progress{position:absolute;top:116px;left:50%;z-index:8;display:flex;gap:7px;transform:translateX(-50%)}
    .star{width:28px;height:28px;background:#ffffff80;clip-path:polygon(50% 0%,61% 35%,98% 35%,68% 57%,79% 94%,50% 72%,21% 94%,32% 57%,2% 35%,39% 35%);filter:drop-shadow(0 2px 1px #24528a80);transition:.3s}.star.done{background:#ffd83d;filter:drop-shadow(0 0 7px #fff38a);animation:pop .35s}
    @keyframes pop{50%{transform:scale(1.7)}}
    .playfield{position:absolute;inset:0;z-index:4}
    .gun-cursor{display:none;position:fixed;z-index:45;left:0;top:0;width:90px;height:135px;pointer-events:none;filter:drop-shadow(0 8px 6px #10264e80);transform:translate(-50%,3px);transform-origin:50% 0}
    .gun-cursor img{display:block;width:100%;height:100%;object-fit:contain}
    .gun-cursor.recoil{animation:gunRecoil .16s ease-out}
    @keyframes gunRecoil{50%{transform:translate(-50%,12px) scale(.95)}}
    .balloon{position:absolute;left:-230px;width:clamp(131px,17.5vw,185px);height:clamp(198px,26.25vw,278px);padding:0;border:0;background:transparent;color:#fff;font-weight:1000;font-size:clamp(1.9rem,5vw,3.3rem);text-shadow:0 3px 0 #0006;cursor:pointer;filter:drop-shadow(0 14px 12px #22527f40);animation:flyRight var(--duration) linear forwards;touch-action:manipulation}
    .balloon-inner{position:absolute;inset:0;display:block;animation:wiggle 1.8s ease-in-out infinite alternate;transform-origin:50% 40%}
    .balloon img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;pointer-events:none}
    .balloon-label{position:absolute!important;z-index:2!important;left:50%;top:25%;transform:translate(-50%,-50%);width:70%;text-align:center}
    @keyframes flyRight{from{left:-230px}to{left:calc(100vw + 230px)}}
    @keyframes wiggle{from{transform:translateY(-5px) rotate(-2deg)}to{transform:translateY(6px) rotate(3deg)}}
    .balloon.pop{animation:burst .28s ease-out forwards}
    @keyframes burst{50%{transform:scale(1.2)}to{transform:scale(0);opacity:0}}
    .question{position:absolute;left:50%;bottom:22px;z-index:10;transform:translateX(-50%);width:min(92%,560px);padding:12px 18px 15px;border:4px solid #fff;border-radius:28px;background:linear-gradient(135deg,#fff8dd,#fff);box-shadow:0 9px 0 #e5a928,0 15px 30px #2355804d;text-align:center}
    .instruction{font-size:clamp(.8rem,2.4vw,1rem);font-weight:800;color:#53709a}.prompt{margin-top:2px;font-size:clamp(2rem,7vw,4rem);font-weight:1000;color:#17336b}.blank{display:inline-block;min-width:92px;color:#e94c82;border-bottom:7px solid #e94c82}
    .toast{position:absolute;left:50%;top:46%;z-index:30;transform:translate(-50%,-50%);font-size:clamp(2rem,7vw,4rem);font-weight:1000;color:#fff;text-shadow:0 5px 0 #17336b;animation:toast .75s forwards;pointer-events:none}
    @keyframes toast{from{transform:translate(-50%,-20%) scale(.5);opacity:0}30%{opacity:1;transform:translate(-50%,-50%) scale(1.15)}to{transform:translate(-50%,-80%) scale(1);opacity:0}}
    .overlay{position:absolute;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;padding:18px;background:#1744739c;backdrop-filter:blur(5px)}
    .card{width:min(92vw,590px);padding:clamp(22px,5vw,42px);border:5px solid #fff;border-radius:38px;background:linear-gradient(145deg,#fff9dc,#fff);box-shadow:0 14px 0 #276bae,0 28px 70px #102a5b80;text-align:center}
    .mini{font-size:clamp(2.8rem,11vw,5.8rem);line-height:1}.card h1{margin:10px 0 7px;font-size:clamp(2rem,7vw,3.7rem);line-height:1;color:#22549a}.card p{margin:10px auto 22px;max-width:440px;font-size:clamp(1rem,3vw,1.25rem);line-height:1.4}.rule{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin:18px 0}.rule b{padding:8px 12px;border-radius:15px;background:#e7f4ff;color:#205294}.mainbtn{border:0;border-radius:20px;padding:14px 30px;background:linear-gradient(#ff6e9c,#ed3976);color:#fff;box-shadow:0 7px 0 #b52058;font-size:clamp(1.15rem,4vw,1.5rem);font-weight:1000;cursor:pointer}.mainbtn:active{transform:translateY(5px);box-shadow:0 2px 0 #b52058}.hidden{display:none!important}
    @media(max-width:620px){.hearts{right:9px;bottom:132px;gap:2px;padding:5px 7px}.life-heart{font-size:1.35rem}}
    @media(hover:hover) and (pointer:fine){.playfield,.balloon{cursor:none}.gun-cursor{display:block}}
    @media(max-height:650px){.brand{top:8px}.hud{top:48px}.progress{top:98px}.question{bottom:12px;padding:8px 14px 10px}.prompt{font-size:2rem}.balloon{width:110px;height:165px}.card{padding:18px}.card p{margin:7px auto 12px}.mini{font-size:3rem}.hearts{bottom:105px}.life-heart{font-size:1.25rem}}
    @media(prefers-reduced-motion:reduce){.cloud,.sun{animation:none}.balloon{animation-name:flyRight}}
  </style>
</head>
<body>
<main class="game" id="game">
  <img class="sun" src="assets/sun.png" alt=""><img class="cloud c1" src="assets/cloud.png" alt=""><img class="cloud c2" src="assets/cloud.png" alt=""><img class="cloud c3" src="assets/cloud.png" alt=""><img class="cloud c4" src="assets/cloud.png" alt=""><img class="cloud c5" src="assets/cloud.png" alt=""><div class="hill"></div><div class="hill two"></div>
  <div class="brand">Learn with Larisa Korotaeva</div>
  <section class="hud" aria-label="Счёт и жизни">
    <div class="pill">⭐ <span id="score">0</span></div>
    <div class="hearts" id="hearts" aria-label="Пять жизней"></div>
    <button class="pill sound" id="sound" aria-label="Выключить звук">🔊</button>
  </section>
  <div class="progress" id="progress" aria-label="Прогресс"></div>
  <div class="playfield" id="playfield"></div>
  <div class="gun-cursor" id="gunCursor" aria-hidden="true"><img src="assets/blaster.png" alt=""></div>
  <section class="question">
    <div class="instruction">Лопни шарик с правильным словом</div>
    <div class="prompt"><span id="pronoun">I</span> <span class="blank">?</span></div>
  </section>
  <section class="overlay" id="start">
    <div class="card"><div class="mini">🎈</div><h1>Лопни шарик!</h1><p>Помоги местоимениям найти правильную форму глагола <b>to be</b>.</p><div class="rule"><b>I — am</b><b>he, she, it — is</b><b>we, you, they — are</b></div><button class="mainbtn" id="startBtn">Играть!</button></div>
  </section>
  <section class="overlay hidden" id="finish">
    <div class="card"><div class="mini" id="finishIcon">🏆</div><h1 id="finishTitle">Прекрасно!</h1><p id="finishText"></p><button class="mainbtn" id="againBtn">Играть ещё</button></div>
  </section>
</main>
<script>
(() => {
  const answers={I:'am',He:'is',She:'is',It:'is',We:'are',You:'are',They:'are'};
  const pronouns=Object.keys(answers), verbs=['am','is','are'], roundCount=10;
  const balloonImages=['balloon-pink.png','balloon-purple.png','balloon-blue.png','balloon-yellow.png','balloon-green.png','balloon-red.png','balloon-blue-2.png','balloon-orange.png'];
  const $=id=>document.getElementById(id);
  const field=$('playfield'), gunCursor=$('gunCursor'), pronounEl=$('pronoun'), scoreEl=$('score'), heartsEl=$('hearts'), progress=$('progress');
  let active=false, score=0, lives=5, step=0, current='I', questionSequence=[], timer=null, soundOn=true, audio=null;
  function tone(freq,duration,type='sine',delay=0){if(!soundOn)return; audio ||= new (window.AudioContext||window.webkitAudioContext)(); const o=audio.createOscillator(),g=audio.createGain();o.type=type;o.frequency.value=freq;g.gain.setValueAtTime(.12,audio.currentTime+delay);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+delay+duration);o.connect(g).connect(audio.destination);o.start(audio.currentTime+delay);o.stop(audio.currentTime+delay+duration)}
  function goodSound(){tone(660,.13,'sine');tone(990,.22,'sine',.1)}
  function badSound(){tone(190,.12,'square');tone(135,.2,'sawtooth',.1)}
  function shotSound(){if(!soundOn)return;audio ||= new (window.AudioContext||window.webkitAudioContext)();const length=Math.floor(audio.sampleRate*.11),buffer=audio.createBuffer(1,length,audio.sampleRate),data=buffer.getChannelData(0);for(let i=0;i<length;i++)data[i]=(Math.random()*2-1)*Math.pow(1-i/length,3);const source=audio.createBufferSource(),filter=audio.createBiquadFilter(),gain=audio.createGain();filter.type='lowpass';filter.frequency.value=1300;gain.gain.value=.34;source.buffer=buffer;source.connect(filter).connect(gain).connect(audio.destination);source.start();tone(95,.12,'square')}
  function renderProgress(){progress.innerHTML=Array.from({length:roundCount},(_,i)=>`<i class="star ${i<step?'done':''}"></i>`).join('')}
  function updateHud(){scoreEl.textContent=score;heartsEl.innerHTML=Array.from({length:5},(_,i)=>`<span class="life-heart ${i<lives?'':'empty'}" aria-hidden="true">❤️</span>`).join('');heartsEl.setAttribute('aria-label',`Жизни: ${lives} из 5`)}
  function toast(text){const el=document.createElement('div');el.className='toast';el.textContent=text;$('game').appendChild(el);setTimeout(()=>el.remove(),760)}
  function clearBalloons(){field.querySelectorAll('.balloon').forEach(b=>b.remove())}
  function nextQuestion(){if(step>=roundCount)return win();current=questionSequence[step];pronounEl.textContent=current;renderProgress();clearBalloons();spawnWave()}
  function spawnWave(){if(!active)return;const correct=answers[current],wrong=verbs.filter(v=>v!==correct);const words=[correct,wrong[0],wrong[1],wrong[0],wrong[1]].sort(()=>Math.random()-.5);const pictures=[...balloonImages].sort(()=>Math.random()-.5).slice(0,5);words.forEach((word,i)=>{const b=document.createElement('button');b.className='balloon';b.style.top=`${11+i*11+Math.random()*2}%`;b.style.setProperty('--duration',`${20+Math.random()*3}s`);b.style.animationDelay=`${i*.5}s`;b.innerHTML=`<span class="balloon-inner"><img src="assets/${pictures[i]}" alt=""><span class="balloon-label">${word}</span></span>`;b.dataset.word=word;b.setAttribute('aria-label',word);b.onclick=()=>choose(b,word);b.addEventListener('animationend',()=>{b.remove();if(active&&field.children.length===0)spawnWave()});field.appendChild(b)})}
  function choose(balloon,word){if(!active||balloon.disabled)return;balloon.disabled=true;balloon.classList.add('pop');setTimeout(()=>balloon.remove(),280);if(word===answers[current]){score+=10;step++;setTimeout(goodSound,120);toast('Верно! +10 ⭐');updateHud();setTimeout(nextQuestion,650)}else{lives--;setTimeout(badSound,120);toast('Попробуй ещё!');updateHud();if(lives<=0)setTimeout(lose,500)}}
  function startGame(){score=0;lives=5;step=0;questionSequence=[...pronouns,'I','She','They'].sort(()=>Math.random()-.5);active=true;updateHud();$('start').classList.add('hidden');$('finish').classList.add('hidden');nextQuestion()}
  function end(){active=false;clearTimeout(timer);clearBalloons();$('finish').classList.remove('hidden')}
  function win(){end();goodSound();setTimeout(goodSound,260);$('finishIcon').textContent='🏆';$('finishTitle').textContent='Ты молодец!';$('finishText').textContent=`Все 10 ответов верны. Твой результат: ${score} звёзд!`}
  function lose(){end();$('finishIcon').textContent='🎈';$('finishTitle').textContent='Шарики улетели';$('finishText').textContent=`Ты набрал(а) ${score} звёзд. Попробуй ещё раз — всё получится!`}
  field.addEventListener('pointermove',e=>{gunCursor.style.left=`${e.clientX}px`;gunCursor.style.top=`${e.clientY}px`;gunCursor.style.opacity='1'});field.addEventListener('pointerleave',()=>gunCursor.style.opacity='0');field.addEventListener('pointerdown',()=>{if(!active)return;shotSound();gunCursor.classList.remove('recoil');void gunCursor.offsetWidth;gunCursor.classList.add('recoil')});
  $('startBtn').onclick=startGame;$('againBtn').onclick=startGame;$('sound').onclick=()=>{soundOn=!soundOn;$('sound').textContent=soundOn?'🔊':'🔇';$('sound').setAttribute('aria-label',soundOn?'Выключить звук':'Включить звук')};
  renderProgress();updateHud();
})();
</script>
</body>
</html>
